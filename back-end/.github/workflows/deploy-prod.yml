name: Deploy Borali Backend (Production)

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build project
        run: npm run build

      - name: Prepare deployment package
        run: |
          tar -czf borali-backend.tar.gz \
            build/ \
            docker-compose.prod.yml \
            Dockerfile \
            .dockerignore \
            prisma/ \
            package.json \
            package-lock.json

      - name: Upload package to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "borali-backend.tar.gz"
          target: "~/borali-backend"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/borali-backend
            rm -rf build prisma Dockerfile docker-compose.prod.yml package*.json .dockerignore
            tar -xzf borali-backend.tar.gz
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -af --filter "until=24h" || true
            rm -f borali-backend.tar.gz
