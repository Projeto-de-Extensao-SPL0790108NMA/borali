name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  NODE_VERSION: 20
  MIN_COVERAGE: 70

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      node-cache-hit: ${{ steps.node-cache.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: node-setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        id: node-cache
        run: npm install

      - name: Save artifact for other jobs
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules

      - name: Security audit
        run: |
          echo "Running npm audit..."
          AUDIT_OUTPUT=$(npm audit --json || true)

          HIGH_VULNS=$(echo "$AUDIT_OUTPUT" | jq '[.advisories[]? | select(.severity=="high")] | length')
          CRITICAL_VULNS=$(echo "$AUDIT_OUTPUT" | jq '[.advisories[]? | select(.severity=="critical")] | length')

          echo "Críticas: $CRITICAL_VULNS | Altas: $HIGH_VULNS"

          if [ "$HIGH_VULNS" -gt 0 ] || [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "::error::Encontradas $CRITICAL_VULNS críticas e $HIGH_VULNS altas"
            exit 1
          fi

      - name: Outdated dependencies (informativo)
        run: npm outdated || true

      - name: Scan secrets
        run: |
          pip install detect-secrets
          detect-secrets scan src/ || true
          echo "Scan completed"
        timeout-minutes: 5

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules

      - name: Lint
        run: |
          echo "Instalando dependências localmente..."
          npm install
          echo "Executando ESLint..."
          ESLINT_CONFIG_PATH=eslint.config.sonar.mjs npx eslint .

      - name: Type check
        run: |
          echo "Executando verificação de tipos..."
          npx tsc --noEmit

      - name: Run unit tests with coverage
        run: |
          echo "Executando testes unitários..."
          npm test -- --coverage
        continue-on-error: false

      - name: Verify coverage threshold
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::Arquivo de coverage não encontrado!"
            exit 1
          fi
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')
          echo "Cobertura atual: $COVERAGE%"
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "::error::Cobertura abaixo de $MIN_COVERAGE%!"
            exit 1
          fi

      - name: Check code duplication
        run: |
          echo "Verificando duplicação de código..."
          npx jscpd src --ignore "node_modules/**,**/*.test.*,**/*.spec.*,.next/**,public/**" --threshold 5

  build-and-e2e:
    name: Build and E2E Tests
    runs-on: ubuntu-latest
    needs: [setup, quality]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules

      - name: Setup Playwright cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium --only-shell

      - name: Build application
        run: |
          echo "Instalando dependências localmente..."
          npm install
          echo "Compilando a aplicação..."
          npm run build

      - name: Run E2E tests
        run: |
          echo "Executando testes E2E..."
          npx start-server-and-test "npm run start" http://localhost:3000 "npx playwright test"
